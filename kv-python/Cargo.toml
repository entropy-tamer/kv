[package]
name = "kv-python"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for KV service"
readme = "README.md"
keywords = ["kv", "storage", "redis", "database", "python"]
categories = ["database", "caching"]

[lib]
name = "kv_python"
crate-type = ["cdylib"]

[dependencies]
# Workspace dependencies
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Local dependencies
kv-core = { version = "0.1.1", path = "../kv-core" }
kv-client = { version = "0.1.1", path = "../kv-client" }

# Python bindings (maturin project)
pyo3 = { version = "0.27.1", features = ["extension-module", "abi3-py38"] }
pyo3-async-runtimes = { version = "0.27.0", features = ["tokio-runtime"] }

# Additional dependencies
bytes = "1.10.1"
tokio-util = { version = "0.7.16", features = ["codec"] }
futures = "0.3.31"
getrandom.workspace = true
parking_lot.workspace = true
parking_lot_core.workspace = true
rand_core.workspace = true
bitflags.workspace = true
hashbrown.workspace = true

# Linting configuration
[lints.clippy]
pedantic = "warn"
nursery = "warn"
cargo = "warn"
all = "warn"
multiple-crate-versions = "allow"
