[workspace]
members = [
    "kv-core",
    "kv-client",
    "kv-python"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Reynard Team"]
license = "MIT"
repository = "https://github.com/entropy-tamer/kv"
description = "Secure, encrypted key-value store to replace Redis with pub/sub capabilities"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.48.0", features = ["full"] }
async-trait = "0.1.89"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
bincode = "2.0.1"

# Encryption
aes-gcm = "0.10.3"
hkdf = "0.12.4"
rand = "0.9.2"
base64 = "0.22.1"

# Web server
axum = { version = "0.8.6", features = ["macros"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["cors", "trace", "fs"] }
hyper = { version = "1.7.0", features = ["full"] }
tls = { package = "tokio-rustls", version = "0.26.4" }

# Storage
dashmap = "6.1.0"
sled = "0.34.7"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
chrono = { version = "0.4.42", features = ["serde"] }

# Error handling
anyhow = "1.0.100"
thiserror = "2.0.17"

# Logging
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

# Configuration
config = "0.15.18"
dotenvy = "0.15.7"

# Testing
tokio-test = "0.4.4"
testcontainers = "0.25.2"

# Additional dependencies
getrandom = "0.3.4"
parking_lot = "0.12.5"
parking_lot_core = "0.9.12"
rand_core = "0.9.3"
bitflags = "2.10.0"